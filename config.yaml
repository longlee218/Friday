# Structured configuration. Secrets live in .env, never here.
database_path: ./data/friday.db

# ── Agents ─────────────────────────────────────────────────────────────────
# One block per step that calls a model, each self-contained: where the model
# lives, which key reaches it, and how it should behave. They are different jobs
# — the cheap high-volume one should not be paying for the careful one.
#
# ${VAR} reads from .env. An unset variable is an error, not an empty string.
#
# `daily_token_budget` is what an agent may spend in a day, in tokens in and
# out, counted from the calls it actually made — so a restart does not forgive
# it. Unset means no ceiling, which is the shipped default: the heartbeat
# reports the day's spend either way, and a number guessed before anyone knows
# what a normal day costs would make the first busy day look like a fault.
# Reaching it is a refusal that becomes work for a person, never a shorter
# answer.
#
# `max_tokens` goes under `settings:` and needs nothing here — that block is
# passed to the model settings whole. It bounds one *answer*, and the two fail
# differently: hitting it truncates a reply, hitting the daily budget refuses
# the call.
#
# `max_attempts` (3) and `retry_backoff_seconds` (1, doubling) are what the
# model layer does with a hiccup. A 429 during a burst or a 502 from the
# provider is tried again; a 400 is not, because the provider is saying the
# request itself is wrong and asking twice costs twice for the same answer.
# Running out of attempts is work for a person, and the reason says so.
#
# Small numbers on purpose: every attempt lives inside `timeout_seconds`,
# which bounds the whole run rather than each try — and one HTTP request is
# given `timeout_seconds / max_attempts`, so a hung provider is cut off with
# budget left to try again rather than spending all of it waiting once. The outbox retries over minutes
# because a send can wait; a task cannot, since the pool works one at a time.
#
# `timeout_seconds` bounds one run of that agent and defaults to 60. It is a
# number chosen here rather than inherited: the OpenAI client's own default is
# ten minutes and it retries past that, and the pool works one task at a time,
# so an unbounded run does not stall one task — it stalls every task, while the
# heartbeat goes on saying the process is alive. Raise it for an agent that
# reads logs; leave it for one that classifies a sentence.
#
# Everything goes through the Chat Completions API, which is why swapping
# provider is three lines rather than a rewrite. Known endpoints:
#   OpenAI    https://api.openai.com/v1
#   DeepSeek  https://api.deepseek.com
#   MiniMax   https://api.minimaxi.chat/v1
agents:
  # Runs on every single mention. Verified against MiniMax: M2.7 cannot extract
  # parameters (environment, correlationId) regardless of prompting; M3 can. The
  # high-volume path needs the better model here, which inverts the usual
  # assumption — do not 'optimise' this down without re-running the probe.
  triage:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1
    # Escalate to a human below this rather than guessing. A placeholder until
    # real decisions accumulate — do not trust this number yet.
    confidence_threshold: 0.7
    # How old a turn may be before it is marked `outdated` instead of
    # answered — written as a number and a unit: 10s, 10m, 10h.
    #
    # Leave it out for no limit, which is what happened before this existed.
    # Set it and a message written longer ago than this is recorded, kept and
    # shown on the board, and never sent to a model: nothing is dropped, the
    # reply is. The case it exists for is a restart against a cold cursor —
    # the sweep asks each channel for everything after it, and with no cursor
    # that is the whole history, so without this the agent works through a
    # week of messages whose authors moved on.
    #
    # A turn is judged by its newest message, so somebody returning to their
    # own thread pulls the older part back in with them. A reply to something
    # this system asked is never outdated, however late — the task asked, and
    # is still waiting.
    max_message_age: '24h'

    # How many past classifications the operator marked right to show as
    # examples. Read once at startup: examples belong in the stable front of
    # the prompt, so a mark made now takes effect on the next restart.
    examples: 8

  # Runs only on tasks that reached a reply. Low volume, and the output goes out
  # under your name — worth a better model and some warmth.
  responder:
    # 150s, not the 60 every other agent takes. `timeout_seconds` bounds the
    # whole run and each HTTP request gets `timeout_seconds / max_attempts` —
    # so 60 with three attempts gave each try 20 seconds, and a real draft
    # measured 20012ms and 20183ms before being cut off. Three attempts, all
    # cut at the same wall, the run failed, the pool re-planned, and the
    # whole extract-and-respond cycle ran again: what looked like a loop was
    # a budget.
    #
    # It is the slow one on purpose. It runs on a prompt carrying the room's
    # context and a fetched skill body, it writes prose rather than a label,
    # and it runs on tasks that reached a reply rather than on every mention
    # — so a longer wait costs little and a truncated one costs a reply.
    timeout_seconds: 150
    api_key: ${RESPONDER_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0.7
    max_turns: 1
    # How many of your past replies to show it as tone examples.
    tone_examples: 8

  # Summarises a channel once it has said anything since its last summary,
  # so later prompts for that room carry a few structured facts instead of a
  # growing transcript. Without this block the summary never happens and the
  # derived section of every context file stays whatever was last written
  # there — startup says so.
  #
  # It runs on the heartbeat and asks each room whether it has said anything
  # since the summary it already has, so a quiet channel costs nothing. There
  # is no other gate: a room that has said one thing gets a summary call for
  # one thing, because the raw alternative — an unbounded transcript in the
  # extractor's prompt — has already cost more than that once.
  # summary:
  #   api_key: ${TRIAGE_API_KEY}
  #   base_url: "https://api.minimax.io/v1"
  #   model: "MiniMax-M3"
  #   settings:
  #     temperature: 0
  #   max_turns: 1

  # ── The extractor ─────────────────────────────────────────────────────────
  # Triage says what a message is and stops. Everything a task knows is lifted
  # out of the message here, by the extractor for its type, reading every
  # message the reporter has sent about it — the answer to "which environment?"
  # arrives as an ordinary follow-up.
  #
  # **Without this block every type opens tasks with no parameters at all**,
  # and the reporter is asked for what they already said. Startup warns about
  # it; nothing else fills those fields.
  #
  # One block for every type. There were three — one per task type — on the
  # argument that reading a correlationId is a different job from reading a
  # repo name and might want a different model. All three held identical
  # values for as long as they existed, so it was one configuration written
  # three times. Each type still has its own prompt and its own schema; only
  # where the model lives is shared. Split the key back out on the day a type
  # actually needs its own.
  #
  # The model is allowed to hallucinate — `friday/domain/validation.py` catches what
  # it gets wrong. Cheap models on purpose: the job is copying values out of
  # text, not reasoning.
  extractor:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1

  # ── The api_issue graph's one model node ──────────────────────────────────
  # There were four blocks here once — `dag_read_logs`, `dag_find_code`,
  # `dag_analyze`, `dag_compose` — one per node of a five-node `api_issue`
  # investigation the operator removed on 2026-09-07 as "a workflow nobody
  # had described, built from a guess at what investigating an API fault
  # looks like, and every node of it skipped on every run because no tool
  # server was ever configured".
  #
  # `diagnose` is not one of those coming back. The graph it belongs to
  # (board `read-it-the-way-the-operator-does`, ticket 00) is a transcription
  # of the operator's own routine, and it is the *only* node of that graph
  # that calls a model: reading a domain, finding a pod, cutting a log down
  # and opening a file are all code. One model node, one prompt, one shape it
  # has to answer — which is also what makes it measurable (ticket 14).
  #
  # **Comment this block out and the graph still runs.** Every node that
  # cannot do its job says so in its envelope, the report is still written,
  # and `Diagnose` skips with "no diagnose agent is configured". That is the
  # difference from the graph that was deleted: the skipping is not silent.
  #
  # Slow on purpose, like the responder and for the same reason: it reads a
  # dossier and a file rather than writing a label, and a truncated run costs
  # the whole investigation. Its node's clock is derived from this number
  # plus five seconds, so raising it here moves the node's with it.
  diagnose:
    timeout_seconds: 150
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1

# ── The api_issue graph ────────────────────────────────────────────────────
# What the investigation reaches outside this process with. Everything here
# is optional: a node with no source skips and says which one it wanted.
api_issue:
  # The SSH alias `kubectl` runs behind. Measured 2026-09-18: there is no
  # kubeconfig for dev on this machine — `kubectl` runs on the dev host, so
  # this is the only way in. Empty means dev logs are not read at all.
  ssh_host: "dev"
  # Which MCP server under `mcp_servers:` carries the Loki tools, and which
  # of its tools answers a range query. Nothing is read from production until
  # that server block exists.
  #
  # The tool name is the field most likely to be wrong here: the session that
  # measured the devops MCP (ticket 16) read its catalogue without running a
  # query through it. A wrong name is a node that says so, correctable here
  # without a release.
  loki_server: "devops-generic"
  loki_tool: "loki_query_range"
  # Where each run's report is written. Nothing in it is sent to anybody.
  reports_dir: "./data/reports"

# ── Workflows ──────────────────────────────────────────────────────────────
# How often to say the process is alive and what it is holding.
# Who is asked to approve a reply, by direct message from the bot.
operator_id: 482447107983147039

# The read-only debug view. It shows every captured message and every model
# prompt and has no authentication, so it stays on loopback unless BOARD_TOKEN
# is set.
board_host: "127.0.0.1"
board_port: 8086
# Browser origins allowed to read the API — the frontend in development.
board_origins: []

heartbeat_seconds: 60

# How long Discord may be down before you are told, and when the daily
# "still alive" summary goes out.
down_after_seconds: 300
summary_at_hour: 9

# How long to keep the prompts and outputs behind each decision.
keep_model_calls_days: 14

# Tool servers outside this process. Adding one is a block here, not a module.
#
# `allow` names the tools an agent may see. Leaving it out means every tool the
# server offers — including its write tools, if it has any. A trace is a
# read-only act, so name what it may use.
mcp_servers: {}
# Empty, and nothing looks for a named server any more: the two below were
# `loki` and `source`, wanted by the `api_issue` graph's nodes, and that graph
# was removed (see the note in the agents section). They are left as a worked
# example of the shape, not as something to switch on.
#
# `allow` is the filter — a prompt is a request and a filter is not, so an
# agent asked "why did this request fail" is not able to delete a log stream
# or write a file.
#
#  loki:
#    command: npx
#    args: ["-y", "<the loki mcp server>"]
#    env:
#      LOKI_URL: ${LOKI_URL}
#    allow: [query_range, labels]
#
#  source:
#    command: npx
#    args: ["-y", "<a filesystem mcp server>", "/path/to/the/repo"]
#    # Read-only. Nothing here writes, and the node that would have
#    # (`dag_fix`, calling `apply_fix`) went with the graph.
#    allow: [read_file, search_files]

outbox:
  # How many times to try one message before handing it to a person.
  max_attempts: 3
  # Doubling from here.
  backoff_seconds: 30

workflows:
  # How many times to ask for the same missing detail before it becomes a
  # person's problem.
  max_asks: 3
  # How many tasks the pool works at once. A pass used to await each graph
  # in turn, so one slow graph held every other task behind it. Small on
  # purpose: every graph shares one SQLite file and one provider's rate
  # limit. At least 1 — zero is refused at startup.
  concurrency: 2
  # Let the responder phrase the ask in the operator's own voice, from the
  # conversation and their real messages, instead of the fixed template.
  # Still sent with no approval step (see auto_ask_for_details below): what
  # is being asked never changes, only the wording does, and the responder
  # falls back to the plain template if it fails to write one.
  use_responder: true
  # Send the missing-detail question straight away, with no approval step.
  # This is the only reply allowed out unreviewed: which fields are missing
  # is decided by fixed logic, not by the model, so a wrong classification
  # costs the reporter one unnecessary question at worst. Everything else
  # parks for a human.
  #
  # "Only the wording changes" is enforced, not assumed. It was assumed for
  # months, while the responder's input carried other people's channel
  # messages — so the one path with no human in it was also the one whose
  # wording a model wrote from untrusted text under your name. Every draft now
  # passes `friday/responder/check.py` first: no link, no code block, near the
  # template's length, no promise, no work the question did not name, and —
  # where the template named something that cannot be translated, like
  # correlationId — it still names it. Failing sends the plain template and
  # logs why. False refusals are expected and cost a plainer question, which
  # is the right way round.
  #
  # **Off since 2026-09-15, and the floor above is why rather than why not.**
  # Every message this ever sent — three of them, on 2026-09-14 — ended in
  # "anh trace giúp", a promise to trace, under the operator's name, with the
  # floor in place and passing them: it held a list of phrasings drawn from
  # one incident, so it caught that sentence and not the promise. Ticket 12
  # replaced the rule with one that reads the other way round, and that rule
  # is still a heuristic — it catches an action the question did not name, not
  # every way a sentence can commit somebody.
  #
  # So this is off until a person has read what it wants to send. Turning it
  # back on is this one line; what it costs while off is that a task missing a
  # detail waits in `needs_human` instead of asking, which is slower and is
  # not a lost mention.
  auto_ask_for_details: false

ingest:
  # Which kinds of mention create work: direct, role, dm
  #   direct — someone @s the account
  #   role   — a role the account holds is @d
  #   dm     — a one-to-one DM (always watched; not subject to the list below)
  # mention_types: ["direct", "role", "dm"]
  mention_types: ["direct", "role"]

  # How long somebody has to be quiet — not sending, not typing — before what
  # they said is read as finished. People send one thought in three messages,
  # three seconds apart; this is what makes it one input instead of three, and
  # one model call instead of three. Discord repeats the typing signal about
  # every ten seconds while somebody is still writing, so twelve seconds of
  # silence means they have actually stopped.
  turn_seconds: 12

  # How often the recovery sweep runs, in seconds. It also runs immediately
  # whenever the connection comes back.
  sweep_interval_seconds: 300

  # How many prior messages to pull in the first time a conversation
  # mentions you, so the first mention has history behind it.
  context_messages: 20

  # Channels to watch. Threads inside a watched channel are covered
  # automatically — a thread reports its parent as the channel.
  #
  # One-to-one DMs do NOT need to be listed; they are always watched.
  # Group chats DO need to be listed, and only count when they mention you.
  watched_channels:
    # # ── Superminded (guild 893368757362229268) ──
    # - "1360170800153366600"
    # - "1467721795770650786"
    # - "1522456774731366531"
    # - "1534479907726295090"
    # - "1534497506824552448"
    # - "1387378210353709116"
    # - "1537392360630001674"
    # - "1539549225463975946"

    # ── TheNeo (guild 1465194563500249221) ──
    - "1544369941296189591"

    # # ── Web AI IOS 3.0 — my team (guild 1326016197547790457) ──
    # - "1326016276857880699"
    # - "1368808041268383914"

    # # ── Group chat ──
    # - "1536991232931135488"

# ── What the operator writes down ─────────────────────────────────────────
context:
  # What a room is known to be is rows in the database now, written on the
  # board's memory form — not a directory of YAML files. A second install
  # that still has one runs `uv run import_context_files.py <dir>` once.
  # One Markdown file per skill, with `name` and `description` in its
  # frontmatter. Adding a skill is adding a file — there is no list to edit.
  # Agents are shown one line per skill and fetch the body only when they
  # decide to use it, which is what keeps a hundred skills affordable.
  skills_directory: skills
  # A ceiling refuses; it does not trim. A summary cut mid-field says
  # something false about the room; the previous one standing is merely
  # older. Measured on the stored, structured summary — the four fields the
  # summariser is asked for, not the transcript it read.
  summary_max_chars: 6000
  # Node 0's own budget for a task's transcript, in *estimated* tokens —
  # characters divided by four, because the configured provider has no
  # tokenizer. Unset (the default) means no compaction at all: the
  # measurement runs from the first day, and this is a number to set once a
  # normal task's cost is known, the same doctrine `daily_token_budget`
  # follows. Board `what-the-room-already-knows`, ticket 08.
  # extraction_budget_tokens: 2000

# ── What never reaches the model ───────────────────────────────────────────
# A message containing any of these is not sent to the classifier. It becomes
# work for you instead — it is **held, never dropped**: some of these words
# turn up in ordinary reports ("token hết hạn rồi" is a bug, "cho em xin api
# key của staging" is an access request), and skipping them would be losing
# real mentions on the strength of one word.
#
# Matched on whole words, case-insensitively, with Vietnamese diacritics folded
# away — `lương` also catches `luong`, so you do not need both spellings. A
# phrase matches only when its words appear together and in order.
#
# Add to this whenever you notice something. It is read at startup, so it takes
# a restart and no rebuild.
sensitive_words:
  # Pay
  - lương
  - thưởng
  - salary
  - bonus
  - payroll
  - payslip
  - compensation
  # Health and personal records
  - sổ y tế
  - bệnh án
  - bảo hiểm
  - medical record
  # Credentials — these also appear in real bug reports, which is exactly why
  # the outcome is "hand it to you" and not "ignore it".
  - mật khẩu
  - password
  - xin token
  - xin api key
  - api key
  - secret key
  - private key
  - credential

# ── Triage examples ────────────────────────────────────────────────────────
# Classifications you wrote by hand. These are used whether or not anything
# has been marked in Discord — a fresh install has nothing marked, and waiting
# for the first reaction before the classifier sees any example is a worse
# start than none.
#
# The other source is what you marked ✅ on in Discord. Nothing else: a
# classification you never looked at is one nobody read, and an agent that
# learns from its own unreviewed output drifts with no floor.
#
#   ✅ ☑️  — that was right, use it as an example
#   ❌ ✖️  — that was wrong
#   remove the reaction to take the mark back
#
# 👍 and 👎 are deliberately NOT marks. A thumbs-up is the most ordinary
# reaction on Discord — "ok anh nhé" to a colleague — and every casual one
# landing on a classified message would quietly become a training example,
# which is the exact thing this signal exists to prevent. The marks are ones
# nobody reaches for by habit.
#
# A mark takes effect on the next restart: examples belong in the stable
# front of the prompt, and a list that changed per call would cost the cache
# hit on everything after it. See `agents.triage.examples` for how many.
# Worked examples, in pairs that differ by one thing — the boundaries are
# what a list of label names cannot teach. Written in the words people
# actually use in this channel, because that is what the classifier reads.
#
# **Nothing here may appear in `evals/triage.jsonl`.** Scoring the classifier
# on a sentence it was shown the answer to measures nothing;
# `evals/build_triage_set.py` drops any overlap on a refresh, and this list
# is what it drops against.
#
# No name of the watched account either: triage is told nothing about who it
# speaks for (`tests/test_agent_voice.py`), and each pair teaches its lesson
# without the @-mention that carried it.
triage_examples:
  # Addressed to us and vague — still work. This is the pair the classifier
  # used to get wrong: it read "short" as "nothing to do".
  - "a ơi bị lỗi api rồi": api_issue
  - "a xem giúp e request này với ạ [image: postman.png]": api_issue
  # A symptom told as a story, no error code, no curl.
  - "e mua gói sub lúc 15h mà 30 phút sau vẫn chưa được cộng coin a ạ": api_issue
  # Findings offered rather than asked — still ours to act on.
  - "nguyên nhân là do request thiếu selling_region nên catalog trả rỗng a nhé": api_issue
  # What a term means, and where a document lives: the answer is writing.
  - "correlationId là cái gì a nhỉ, e ko biết": doc_question
  - "a ơi tài liệu mô tả webhook của Midas nằm ở repo nào v": doc_question
  # Being let in — asked outright, and told as a complaint.
  - "cho em xin quyền vào repo BE-Midas với ạ": access_request
  - "e không mở được Grafana của dev, a add quyền giúp e với": access_request
  # Nothing is being asked of us: a closing reply, and congratulations.
  - "ok a, e hiểu rồi ạ": skip
  - "chúc mừng a lên chức ạ": skip
