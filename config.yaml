# Friday configuration. Secrets live in .env and are read here as ${VAR};
# everything else is a reviewable value. See docs/DESIGN.md for the reasoning.
database_path: ./data/friday.db

# ── Model tiers ──────────────────────────────────────────────────────────────
# Named model tiers; code picks one by name, and an undeclared tier refuses the
# boot. ${VAR} reads .env (unset = error). Everything speaks Chat Completions;
# `provider:` is shorthand for base_url — openrouter · openai · deepseek ·
# minimax (or set base_url directly). `settings` are provider settings
# (max_tokens); temperature, turns and tokens are declared in code beside each
# agent (board domains-plug-in, tickets 07 and 17).
# DeepSeek V4.1 Flash via OpenRouter: cheap ($0.099/$0.60 per 1M, $0.06
# cache-read), 1M context, native tool + JSON-schema structured output. Triage,
# the responder, the extractor and backend.diagnose all run on it.
tiers:
  free:
    api_key: ${OPENROUTER_API_KEY}
    provider: openrouter
    model: "qwen/qwen3-30b-a3b-instruct-2507"
  flash:
    api_key: ${OPENROUTER_API_KEY}
    provider: openrouter
    model: "deepseek/deepseek-v4.1-flash"
  ultra:
    api_key: ${OPENROUTER_API_KEY}
    provider: openrouter
    model: "openai/gpt-5.6-sol"

# ── Operator & board ─────────────────────────────────────────────────────────
operator_id: 482447107983147039   # who approves replies, by DM from the bot

board_host: "127.0.0.1"           # loopback only — the board is unauthenticated
board_port: 8086
board_origins: []                 # extra CORS write origins (the Vite dev server)
repo_root: "~/Documents/Apero"    # where the project repo-picker may look; empty = off

# Daily two-file backup (§12.1): both SQLite files (kept KEEP_BACKUPS days).
backup_dir: "data/backups"

# ── Tool servers (MCP) ─────────────────────────────────────────────────────
# Which tools may be called is declared in code, not here (no `allow:` key).
# `auth: {}` means "sign in once": `uv run authorize.py <name>`.
mcp_servers:
  devops-generic:
    url: "https://devops-generic-mcp.aperogroup.ai/mcp"
    transport: http
    auth: {}
  db-generic:
    url: "https://devops-dbx.aperogroup.ai/mcp"
    transport: http
    auth: {}

# ── Shell hosts ────────────────────────────────────────────────────────────
# Where `core.shell` may run a read-only command: `local` is this machine, any
# other name is an alias in ~/.ssh/config. Which commands may run is declared
# in code (the read-command allowlist), not here.
shell_hosts: [local, dev]

# ── Workflows ───────────────────────────────────────────────────────────────
workflows:
  max_asks: 3                     # times to ask for the same detail before handover
  concurrency: 2                  # tasks worked at once
  use_responder: true             # phrase the ask in your voice, not the template
  # Send the missing-detail question with no approval step. Off since 2026-09-15
  # (see docs/DESIGN.md D10 / responder/check.py). Turning it on is this one line.
  auto_ask_for_details: false

# ── Ingest ──────────────────────────────────────────────────────────────────
ingest:
  # direct — someone @s the account · role — a role it holds is @d · dm — a 1:1 DM
  mention_types: ["direct", "role"]

  # Channels to watch. Threads are covered automatically; 1:1 DMs are always
  # watched and need no entry; group chats must be listed. Uncomment to enable.
