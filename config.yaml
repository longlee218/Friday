# Structured configuration. Secrets live in .env, never here.
database_path: ./data/friday.db

# ── Persona ────────────────────────────────────────────────────────────────
# Who every agent is, before it is told its job. Prose, because it is a page of
# writing meant to be edited as writing. Which agents get which section is
# decided where each agent is built — it is not a knob, and the last time it
# was one it went stale the first time an agent's job changed.
persona:
  file: PERSONA.md

# ── Agents ─────────────────────────────────────────────────────────────────
# One block per step that calls a model, each self-contained: where the model
# lives, which key reaches it, and how it should behave. They are different jobs
# — the cheap high-volume one should not be paying for the careful one.
#
# ${VAR} reads from .env. An unset variable is an error, not an empty string.
#
# Everything goes through the Chat Completions API, which is why swapping
# provider is three lines rather than a rewrite. Known endpoints:
#   OpenAI    https://api.openai.com/v1
#   DeepSeek  https://api.deepseek.com
#   MiniMax   https://api.minimaxi.chat/v1
agents:
  # Runs on every single mention. Verified against MiniMax: M2.7 cannot extract
  # parameters (environment, correlationId) regardless of prompting; M3 can. The
  # high-volume path needs the better model here, which inverts the usual
  # assumption — do not 'optimise' this down without re-running the probe.
  triage:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1
    # Escalate to a human below this rather than guessing. A placeholder until
    # real decisions accumulate — do not trust this number yet.
    confidence_threshold: 0.7
    # How many past classifications the operator marked right to show as
    # examples. Read once at startup: examples belong in the stable front of
    # the prompt, so a mark made now takes effect on the next restart.
    examples: 8

  # Runs only on tasks that reached a reply. Low volume, and the output goes out
  # under your name — worth a better model and some warmth.
  responder:
    api_key: ${RESPONDER_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0.7
    max_turns: 1
    # How many of your past replies to show it as tone examples.
    tone_examples: 8

  # ── Extractors, one per task type ─────────────────────────────────────────
  # Triage says what a message is and stops. Everything a task knows is lifted
  # out of the message here, by the extractor for its type, reading every
  # message the reporter has sent about it — the answer to "which environment?"
  # arrives as an ordinary follow-up.
  #
  # **A type without a block here opens tasks with no parameters at all**, and
  # the reporter is asked for what they already said. Startup warns about it;
  # nothing else fills those fields.
  #
  # The model is allowed to hallucinate — `friday/validation.py` catches what
  # it gets wrong. Cheap models on purpose: the job is copying values out of
  # text, not reasoning.
  extractor_api_issue:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1

  extractor_access_request:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1

  extractor_doc_question:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1

  # ── The api_issue graph, one block per node ───────────────────────────────
  # A node whose block is absent runs without an agent and skips. That is a
  # working state, not a broken one: with none of these the graph ends where
  # the old planner did, asking for a correlationId. But it means the whole
  # investigation is off, silently, which is not something to discover from a
  # week of logs where nothing was ever traced.
  #
  # `read_logs`, `find_code_path` and `fix_bug` also need their tool server —
  # `loki` and `source` under mcp_servers below. An agent without its server
  # skips too; one WITH a server and no agent block does nothing either. Both
  # halves or neither.

  # Fetches log lines for one request. Tool work, not reasoning — the cheap
  # model, and `max_turns` high enough to page through a query.
  dag_read_logs:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 6

  # Follows a stack trace to the file and line it names. Also tool work.
  dag_find_code:
    api_key: ${TRIAGE_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 6

  # Says why the request failed, and whether that is certain enough to act on.
  # The one node whose answer decides whether code gets changed — temperature 0,
  # and worth the better model when there is one.
  dag_analyze:
    api_key: ${RESPONDER_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0
    max_turns: 1

  # Writes the patch. Commented out on purpose: this is the only agent in the
  # system that edits a repository, and turning it on is a decision, not a
  # default. It needs the `source` server as well.
  # dag_fix:
  #   # Returns a diff, or the words CANNOT FIX.
  #   api_key: ${RESPONDER_API_KEY}
  #   base_url: "https://api.minimax.io/v1"
  #   model: "MiniMax-M3"
  #   settings:
  #     temperature: 0
  #   max_turns: 4

  # Writes what goes back to the reporter. The draft still needs approval.
  dag_compose:
    api_key: ${RESPONDER_API_KEY}
    base_url: "https://api.minimax.io/v1"
    model: "MiniMax-M3"
    settings:
      temperature: 0.7
    max_turns: 1

# ── Workflows ──────────────────────────────────────────────────────────────
# How often to say the process is alive and what it is holding.
# Who is asked to approve a reply, by direct message from the bot.
operator_id: 482447107983147039

# The read-only debug view. It shows every captured message and every model
# prompt and has no authentication, so it stays on loopback unless BOARD_TOKEN
# is set.
board_host: "127.0.0.1"
board_port: 8086
# Browser origins allowed to read the API — the frontend in development.
board_origins: []

heartbeat_seconds: 60

# How long Discord may be down before you are told, and when the daily
# "still alive" summary goes out.
down_after_seconds: 300
summary_at_hour: 9

# How long to keep the prompts and outputs behind each decision.
keep_model_calls_days: 14

# Tool servers outside this process. Adding one is a block here, not a module.
#
# `allow` names the tools an agent may see. Leaving it out means every tool the
# server offers — including its write tools, if it has any. A trace is a
# read-only act, so name what it may use.
mcp_servers: {}
# The two the api_issue graph looks for, by name. `allow` is the filter — a
# prompt is a request and a filter is not, so nothing about answering "why did
# this request fail" is able to delete a log stream or write a file.
#
#  loki:
#    command: npx
#    args: ["-y", "<the loki mcp server>"]
#    env:
#      LOKI_URL: ${LOKI_URL}
#    allow: [query_range, labels]
#
#  source:
#    command: npx
#    args: ["-y", "<a filesystem mcp server>", "/path/to/the/repo"]
#    # Read-only until dag_fix is turned on. Adding a write tool here is the
#    # other half of that decision, not a separate one.
#    allow: [read_file, search_files]

outbox:
  # How many times to try one message before handing it to a person.
  max_attempts: 3
  # Doubling from here.
  backoff_seconds: 30

workflows:
  # How many times to ask for the same missing detail before it becomes a
  # person's problem.
  max_asks: 3
  # Let a burst of follow-ups settle before answering it.
  debounce_seconds: 45
  # Let the responder phrase the ask in the operator's own voice, from the
  # conversation and their real messages, instead of the fixed template.
  # Still sent with no approval step (see auto_ask_for_details below): what
  # is being asked never changes, only the wording does, and the responder
  # falls back to the plain template if it fails to write one.
  use_responder: true
  # Send the missing-detail question straight away, with no approval step.
  # This is the only reply allowed out unreviewed: which fields are missing
  # is decided by fixed logic, not by the model, so a wrong classification
  # costs the reporter one unnecessary question at worst. Everything else
  # parks for a human.
  auto_ask_for_details: true

ingest:
  # Which kinds of mention create work: direct, role, dm
  #   direct — someone @s the account
  #   role   — a role the account holds is @d
  #   dm     — a one-to-one DM (always watched; not subject to the list below)
  mention_types: ["direct", "role", "dm"]

  # TESTING ONLY. Lets you trigger the pipeline by tagging yourself.
  # Must be false once the agent can reply as you (ticket 06), or it will
  # answer its own messages forever.
  capture_own_messages: true

  # How often the recovery sweep runs, in seconds. It also runs immediately
  # whenever the connection comes back.
  sweep_interval_seconds: 300

  # How many prior messages to pull in the first time a conversation
  # mentions you, so the first mention has history behind it.
  context_messages: 20

  # Channels to watch. Threads inside a watched channel are covered
  # automatically — a thread reports its parent as the channel.
  #
  # One-to-one DMs do NOT need to be listed; they are always watched.
  # Group chats DO need to be listed, and only count when they mention you.
  watched_channels:
    # # ── Superminded (guild 893368757362229268) ──
    # - "1360170800153366600"
    # - "1467721795770650786"
    # - "1522456774731366531"
    # - "1534479907726295090"
    # - "1534497506824552448"
    # - "1387378210353709116"
    # - "1537392360630001674"
    # - "1539549225463975946"

    # ── TheNeo (guild 1465194563500249221) ──
    - "1544369941296189591"

    # # ── Web AI IOS 3.0 — my team (guild 1326016197547790457) ──
    # - "1326016276857880699"
    # - "1368808041268383914"

    # # ── Group chat ──
    # - "1536991232931135488"

# ── What the operator writes down ─────────────────────────────────────────
context:
  # Per-channel YAML: what the machine learned about a channel, and what you
  # wrote there yourself. `init_channel.py` creates one for you to fill in.
  directory: context
  # One Markdown file per skill, with `name` and `description` in its
  # frontmatter. Adding a skill is adding a file — there is no list to edit.
  # Agents are shown one line per skill and fetch the body only when they
  # decide to use it, which is what keeps a hundred skills affordable.
  skills_directory: skills
  # What share of the model's context window a conversation has to reach
  # before summarising it is cheaper than passing it raw.
  summary_share: 0.5

# ── What never reaches the model ───────────────────────────────────────────
# A message containing any of these is not sent to the classifier. It becomes
# work for you instead — it is **held, never dropped**: some of these words
# turn up in ordinary reports ("token hết hạn rồi" is a bug, "cho em xin api
# key của staging" is an access request), and skipping them would be losing
# real mentions on the strength of one word.
#
# Matched on whole words, case-insensitively, with Vietnamese diacritics folded
# away — `lương` also catches `luong`, so you do not need both spellings. A
# phrase matches only when its words appear together and in order.
#
# Add to this whenever you notice something. It is read at startup, so it takes
# a restart and no rebuild.
sensitive_words:
  # Pay
  - lương
  - thưởng
  - salary
  - bonus
  - payroll
  - payslip
  - compensation
  # Health and personal records
  - sổ y tế
  - bệnh án
  - bảo hiểm
  - medical record
  # Credentials — these also appear in real bug reports, which is exactly why
  # the outcome is "hand it to you" and not "ignore it".
  - mật khẩu
  - password
  - xin token
  - xin api key
  - api key
  - secret key
  - private key
  - credential

# ── Triage examples ────────────────────────────────────────────────────────
# Classifications you wrote by hand. These are used whether or not anything
# has been marked in Discord — a fresh install has nothing marked, and waiting
# for the first reaction before the classifier sees any example is a worse
# start than none.
#
# The other source is what you marked ✅ on in Discord. Nothing else: a
# classification you never looked at is one nobody read, and an agent that
# learns from its own unreviewed output drifts with no floor.
#
#   ✅ ☑️  — that was right, use it as an example
#   ❌ ✖️  — that was wrong
#   remove the reaction to take the mark back
#
# 👍 and 👎 are deliberately NOT marks. A thumbs-up is the most ordinary
# reaction on Discord — "ok anh nhé" to a colleague — and every casual one
# landing on a classified message would quietly become a training example,
# which is the exact thing this signal exists to prevent. The marks are ones
# nobody reaches for by habit.
#
# A mark takes effect on the next restart: examples belong in the stable
# front of the prompt, and a list that changed per call would cost the cache
# hit on everything after it. See `agents.triage.examples` for how many.
triage_examples: []
  # - "the checkout api is 500ing on prod": api_issue
  # - "can I get write access to the payments repo": access_request
  # - "where's the spec for the refund flow": doc_question
  # - "anyone want lunch": skip
