[project]
name = "friday-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "discord-py>=2.7.1",
    "discord-self>=2.1.0.post1",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "openai-agents>=0.22.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
